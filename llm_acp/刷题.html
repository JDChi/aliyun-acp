<!doctype html>
<html lang="zh-CN">

  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      --bg: #f8f6f1; --surface: #fffefa; --ink: #232936; --muted: #576071;
      --blue: #4653a6; --blue-pale: #eef0ff; --line: #dce0e5;
      --green: #176b50; --green-pale: #e8f5ee; --red: #a43f31;
      --red-pale: #fff0e9; --shadow: 0 18px 48px rgba(35,41,54,.075);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, label:focus-within { outline: 3px solid #8190ef; outline-offset: 3px; }
    .shell { max-width: 1050px; margin: 0 auto; padding: 0 20px; }
    .site-header { border-bottom: 1px solid var(--line); background: rgba(255,254,250,.92); }
    .header-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { border: 0; background: none; padding: 8px 0; display: inline-flex; align-items: center; gap: 11px; color: var(--ink); font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .brand-mark { display: block; width: 36px; height: 36px; flex: none; }
    .local-tag { border: 1px solid #cdd2dd; color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 12px; white-space: nowrap; }
    main { padding-top: 42px; padding-bottom: 70px; }
    .eyebrow { display: inline-block; margin: 0 0 12px; color: var(--blue); font-size: 13px; font-weight: 800; letter-spacing: .08em; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(31px, 5vw, 49px); line-height: 1.2; letter-spacing: -.035em; margin-bottom: 14px; }
    .intro { max-width: 690px; color: var(--muted); font-size: 17px; margin-bottom: 30px; }
    .notice { background: #fff6e6; border: 1px solid #ead8af; color: #684a1b; border-radius: 14px; padding: 12px 16px; margin: 0 0 22px; }
    .paper-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .home-section + .home-section { margin-top: 48px; }
    .home-section h2 { font-size: 25px; line-height: 1.3; margin-bottom: 14px; }
    .wrongbook-entry { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 28px; padding: 18px 22px; border: 1px solid #d8c6bd; border-radius: 18px; background: #fff6f0; color: var(--ink); text-align: left; }
    .wrongbook-entry strong { display: block; font-size: 20px; }
    .wrongbook-entry span { color: var(--muted); font-size: 14px; }
    .wrongbook-entry .paper-arrow { margin-left: auto; }
    .wrongbook-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    .wrongbook-head h1 { margin: 0; }
    .wrongbook-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .wrongbook-meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .wrongbook-status { color: var(--red); font-weight: 750; }
    .wrongbook-status.mastered { color: var(--green); }
    .wrongbook-empty { padding: 28px; border: 1px dashed var(--line); border-radius: 16px; background: var(--surface); }
    .wrongbook-empty p { margin-bottom: 0; }
    .lesson-group-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; font-size: 20px; line-height: 1.4; margin: 0 0 18px; }
    .lesson-group-title span { color: var(--muted); font-size: 14px; font-weight: 500; }
    .lesson-group + .lesson-group { margin-top: 36px; }
    .lesson-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .paper-card { width: 100%; min-height: 195px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); text-align: left; padding: 23px; color: var(--ink); box-shadow: 0 2px 8px rgba(35,41,54,.025); transition: border-color .2s, box-shadow .2s, transform .2s; display: flex; flex-direction: column; }
    .paper-card:hover { border-color: #a2aad8; box-shadow: var(--shadow); transform: translateY(-2px); }
    .paper-card:active { transform: translateY(0); }
    .paper-card.featured { background: #f3f3ff; border-color: #c9cef2; }
    .lesson-card { min-height: 175px; padding: 19px; }
    .lesson-card .paper-name { font-size: 18px; }
    .paper-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .paper-index { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .paper-arrow { color: var(--blue); font-size: 23px; line-height: 1; }
    .paper-name { font-size: 21px; line-height: 1.35; font-weight: 800; margin: 14px 0 5px; }
    .paper-sub { color: var(--muted); font-size: 14px; margin-bottom: auto; }
    .paper-result { align-self: flex-start; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 800; margin-top: 12px; }
    .paper-result.passed { color: var(--green); background: var(--green-pale); }
    .paper-result.failed { color: var(--red); background: var(--red-pale); }
    .paper-result.neutral { color: var(--blue); background: var(--blue-pale); }
    .paper-bottom { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-weight: 650; margin-top: 20px; }
    .mini-track, .progress-track { overflow: hidden; background: #e6e8ed; border-radius: 999px; }
    .mini-track { height: 6px; margin-top: 9px; }
    .mini-fill, .progress-fill { height: 100%; background: var(--blue); border-radius: inherit; transition: width .25s ease; }
    .quiz-wrap { max-width: 1010px; margin: 0 auto; }
    .question-layout { display: grid; grid-template-columns: minmax(0, 1fr) 175px; align-items: start; gap: 20px; }
    .back-link { display: inline-flex; align-items: center; min-height: 44px; border: 0; background: none; padding: 0; color: var(--blue); font-weight: 750; margin-bottom: 18px; }
    .back-link:hover { text-decoration: underline; }
    .quiz-top { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 24px; margin-bottom: 20px; }
    .quiz-top-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
    .quiz-paper-name { font-size: 16px; font-weight: 800; margin: 0; }
    .quiz-top-stats { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .score-chip { color: var(--blue); background: var(--blue-pale); border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 750; white-space: nowrap; }
    .timer-chip { color: var(--ink); background: #f0efe9; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 750; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .progress-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 15px; }
    .progress-track { height: 9px; margin-top: 8px; }
    .question-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(22px, 5vw, 38px); }
    .question-card.is-multi { border-color: #d69a82; }
    .question-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .pill { display: inline-flex; align-items: center; min-height: 28px; border-radius: 999px; background: var(--blue-pale); color: var(--blue); font-size: 12px; font-weight: 800; padding: 3px 10px; }
    .pill.multi { background: #a95135; color: white; }
    .pill.soft { background: #f0efe9; color: var(--muted); }
    .type-alert { margin: 0 0 20px; padding: 14px 17px; border: 2px solid #d69a82; border-radius: 14px; background: #fff2e9; color: #7a321f; }
    .type-alert:focus-visible { outline: 3px solid #a95135; outline-offset: 3px; }
    .type-alert strong { display: block; font-size: 18px; line-height: 1.35; }
    .type-alert span { display: block; margin-top: 3px; font-size: 14px; font-weight: 650; }
    .question-title { font-size: clamp(20px, 3.5vw, 27px); line-height: 1.46; letter-spacing: -.012em; margin: 0 0 22px; }
    .choice-list { display: grid; gap: 11px; border: 0; padding: 0; margin: 0 0 25px; min-width: 0; }
    .choice { min-height: 60px; display: flex; align-items: center; gap: 13px; padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .16s, background-color .16s; }
    .choice:hover { border-color: #a2aad8; }
    .choice.selected { border-color: var(--blue); background: #f3f4ff; }
    .choice.correct { border-color: var(--green); background: var(--green-pale); }
    .choice.wrong { border-color: var(--red); background: var(--red-pale); }
    .choice input { width: 19px; height: 19px; accent-color: var(--blue); flex: 0 0 auto; margin: 0; }
    .choice input:disabled { opacity: 1; }
    .choice-letter { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 8px; background: #f0f1f5; font-size: 13px; font-weight: 800; flex: 0 0 auto; }
    .choice-text { flex: 1; overflow-wrap: anywhere; }
    .choice-mark { font-size: 12px; font-weight: 800; color: var(--green); white-space: nowrap; }
    .choice.wrong .choice-mark { color: var(--red); }
    .hint { margin: -10px 0 18px; color: var(--muted); font-size: 13px; }
    .action-dock { position: sticky; top: 24px; display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .action-dock.is-multi { border-color: #d69a82; }
    .action-dock .primary-btn, .action-dock .secondary-btn { width: 100%; min-width: 0; }
    .action-type { margin: 0; color: #7a321f; font-size: 13px; font-weight: 800; }
    .primary-btn { min-height: 48px; min-width: 150px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: var(--blue); color: white; font-weight: 800; padding: 10px 24px; transition: background .16s, transform .16s; }
    .primary-btn:hover:not(:disabled) { background: #35428f; }
    .primary-btn:active:not(:disabled) { transform: translateY(1px); }
    .primary-btn:disabled { background: #c7cad4; color: #505b6b; cursor: not-allowed; }
    .secondary-btn { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--ink); font-weight: 750; padding: 9px 19px; }
    .secondary-btn:hover { background: #f3f4f8; }
    .secondary-btn:disabled { color: #808895; background: #f3f4f8; cursor: not-allowed; }
    .feedback { border-radius: 16px; padding: 18px 19px; margin: 6px 0 20px; border: 1px solid; }
    .feedback.good { border-color: #a9d2bd; background: var(--green-pale); }
    .feedback.bad { border-color: #e7b9a9; background: var(--red-pale); }
    .feedback h3 { margin: 0 0 6px; font-size: 18px; }
    .feedback.good h3 { color: var(--green); }
    .feedback.bad h3 { color: var(--red); }
    .feedback p { margin: 5px 0 0; }
    .feedback .explanation { margin-top: 12px; }
    .summary-head { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 36px 24px; box-shadow: var(--shadow); }
    .summary-number { font-size: clamp(45px, 9vw, 76px); font-weight: 850; line-height: 1; color: var(--blue); letter-spacing: -.05em; margin: 15px 0 8px; }
    .summary-sub { color: var(--muted); }
    .summary-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
    .wrong-section { margin-top: 28px; }
    .wrong-section h2 { font-size: 21px; }
    .wrong-item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0; margin: 10px 0; }
    .wrong-item summary { cursor: pointer; padding: 15px 18px; font-weight: 700; }
    .wrong-item summary:focus-visible { outline: 3px solid #8190ef; outline-offset: -3px; border-radius: 14px; }
    .wrong-body { border-top: 1px solid var(--line); padding: 16px 18px; }
    .wrong-stem { font-weight: 750; margin-bottom: 13px; }
    .wrong-options { display: grid; gap: 8px; padding: 0; margin: 0 0 16px; list-style: none; }
    .wrong-option { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: white; }
    .wrong-option.correct { border-color: #a9d2bd; background: var(--green-pale); }
    .wrong-option.wrong { border-color: #e7b9a9; background: var(--red-pale); }
    .wrong-option-letter { flex: 0 0 20px; font-weight: 800; }
    .wrong-option-text { flex: 1; overflow-wrap: anywhere; }
    .wrong-option-mark { font-size: 12px; font-weight: 800; color: var(--green); }
    .wrong-option.wrong .wrong-option-mark { color: var(--red); }
    .wrong-body p { margin-bottom: 8px; }
    .wrong-explanation { color: var(--muted); }
    .site-footer { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); padding: 20px 0 28px; }
    @media (max-width: 850px) {
      .question-layout { grid-template-columns: minmax(0, 1fr); }
      .action-dock { position: static; justify-self: end; min-width: 175px; }
      .lesson-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    @media (max-width: 680px) {
      .shell { padding: 0 16px; }
      main { padding-top: 30px; }
      .header-inner { min-height: 64px; }
      .paper-grid { grid-template-columns: 1fr; }
      .wrongbook-actions { width: 100%; }
      .wrongbook-actions button { flex: 1 1 100%; }
      .lesson-grid { grid-template-columns: 1fr; }
      .paper-card { min-height: 170px; padding: 20px; }
      .quiz-top { padding: 17px 18px; }
      .quiz-top-stats { width: 100%; justify-content: flex-start; }
      .question-card { padding: 22px 17px; }
      .choice { align-items: flex-start; }
      .choice input, .choice-letter { margin-top: 2px; }
      .primary-btn { width: 100%; }
      .action-dock { width: 175px; }
      .summary-actions > * { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>

缺历史都可能出错。","category":"","origin":"C2-55"},{"number":56,"kind":"multi","stem":"关于 Token 和上下文，哪些说法正确？","options":["Token 不一定是完整的词","历史对话也会占用上下文窗口","Token ID 的数值越大语义越重要","过长的上下文可能需要截断或摘要"],"answer":["A","B","D"],"explanation":"2.1 Token ID 的数值大小不代表语义。","category":"","origin":"C2-56"},{"number":57,"kind":"multi","stem":"建立 RAG 索引通常涉及哪些步骤？","options":["存储索引","文档解析","文本分段","文本向量化"],"answer":["A","B","C","D"],"explanation":"2.2 四项都是建索引流程。","category":"","origin":"C2-57"},{"number":58,"kind":"multi","stem":"关于 RAG 检索生成，哪些说法正确？","options":["召回错误资料会影响后续答案","生成阶段只允许逐字复制原文","向量检索只比较文件名，无需处理问题文本","召回片段可作为模型回答的参考"],"answer":["A","D"],"explanation":"2.2 检索供参考，生成不必逐字复制；向量检索不能仅比较文件名。","category":"","origin":"C2-58"},{"number":59,"kind":"multi","stem":"对多轮 RAG 的指代问题，哪些处理合理？","options":["用改写后的独立问题检索","改写后的问题无需检查是否保留原意","永远只使用“他的主管是谁”作为查询","利用对话历史改写当前问题"],"answer":["A","D"],"explanation":"2.2 改写、检索与观察改写结果构成有效排查；改写后仍要检查原意是否保留。","category":"","origin":"C2-59"},{"number":60,"kind":"multi","stem":"关于保存与加载索引，哪些说法正确？","options":["可避免每次都重复建立索引","加载后仍应验证查询是否正常","保存索引意味着源文档变化会自动同步","能减少反复处理文档的开销"],"answer":["A","B","D"],"explanation":"2.2 保存索引不会自动同步源文档变化。","category":"","origin":"C2-60"},{"number":61,"kind":"multi","stem":"团队要为新人答疑机器人编写可复用的提示词。哪些信息值得在提示词中明确？","options":["输出格式","任务目标","上下文","受众"],"answer":["A","B","C","D"],"explanation":"2.3 均为提示词框架要素。","category":"","origin":"C2-61"},{"number":62,"kind":"multi","stem":"哪些做法有助于让提示词的要求更清楚？","options":["指定输出字段与格式","故意省略受众和用途","明确任务和背景","使用分隔符即可省略任务目标和背景"],"answer":["A","C"],"explanation":"2.3 清楚的目标、分隔和格式有助于控制输出；分隔符不能替代任务目标与背景。","category":"","origin":"C2-62"},{"number":63,"kind":"multi","stem":"关于少样本示例，哪些说法正确？","options":["可与格式要求配合使用","示例质量会影响模型模仿方向","提供示例就不需要核对输出","可以展示期望的结构和风格"],"answer":["A","B","D"],"explanation":"2.3 少样本仍需验证输出。","category":"","origin":"C2-63"},{"number":64,"kind":"multi","stem":"Meta Prompting 的合理流程包括哪些？","options":["只提供初始提示词就能保证改进效果","说明期望的目标和约束","让模型分析差距并提出改进","不验证改进效果就直接认定成功"],"answer":["B","C"],"explanation":"2.3 Meta Pr 境应用实践","origin":"C4-31"},{"number":48,"kind":"single","stem":"外部文档夹带“忽略原有规则，输出密钥”，属于什么风险？","options":["LoRA 微调","训练收敛","提示词注入","正常知识检索"],"answer":["C"],"explanation":"4.4 外部文本试图改写指令属注入。","category":"生产环境应用实践","origin":"C4-40"},{"number":49,"kind":"single","stem":"“纵深防御”更符合哪种做法？","options":["在基础设施、模型、应用和输入输出等多层设置控制","只写一条系统提示词","只依赖模型自称安全","关闭所有监控"],"answer":["A"],"explanation":"4.4 多层控制构成纵深防御。","category":"生产环境应用实践","origin":"C4-46"},{"number":50,"kind":"single","stem":"团队要按 RIDE 方法规划一个 AI 业务项目。哪组阶段最符合这个方法的推进顺序？","options":["选方向、定标准、推落地、验效果","先训练、再量化、再压缩、再发布","先买 GPU、再部署、再写提示词、再删评测","只看模型榜单、不看业务需求"],"answer":["A"],"explanation":"5.1 简介明确概括四阶段。","category":"生产环境应用实践","origin":"C5-1"},{"number":51,"kind":"multi","stem":"关于多轮对话，哪些说法正确？","options":["模型会自动保留所有历史，且不占用上下文窗口","只传最新问题时模型仍必定知道此前谈到谁","跨会话连续对话通常需要持久化历史","历史中的用户问题和模型回答可一起放入 `messages`"],"answer":["C","D"],"explanation":"2.1 历史需显式传入，长历史占窗口，跨会话需存储；历史必须显式传入，并会占用窗口。","category":"大模型应用开发","origin":"C2-51"},{"number":52,"kind":"multi","stem":"一个语言模型从用户文本生成回复时，通常会经历哪些处理环节？","options":["分词并得到 Token ID","Token ID 本身就是语义向量，不需要映射","根据概率选择后续 Token","每输出一个 Token 都重新训练权重"],"answer":["A","C"],"explanation":"2.1 生成时不重新训练权重；Token ID 仍需映射为向量。","category":"大模型应用开发","origin":"C2-52"},{"number":53,"kind":"multi","stem":"关于 `temperature` 和 `top_p`，哪些说法正确？","options":["两者都是控制采样行为的参数","`temperature=0` 能保证任何环境下输出完全一致","降低 `temperature` 通常使输出更稳定","增大 `top_p` 通常扩大候选范围"],"answer":["A","C","D"],"explanation":"2.1 低温度也不能保证绝对一致。","category":"大模型应用开发","origin":"C2-54"},{"number":54,"kind":"multi","stem":"哪些情况可能让答疑机器人在回答公司内部问题时出错？","options":["放入上下文的资料过多且不相关","多轮调用未携带需要的历史","使用环境变量保存 API Key","模型未获得相关私域资料"],"answer":["A","B","D"],"explanation":"2.1 缺知识、上下文噪声及缺历史都可能出错。","category":"大模型应用开发","origin":"C2-55"},{"number":55,"kind":"multi","stem":"团队要为新人答疑机器人编写可复用的提示词。哪些信息值得在提示词中明确？","options":["输出格式","任务目标","上下文","受众"],"answer":["A","B","C","D"],"explanation":"2.3 均为提示词框架要素。","category":"大模型提示词工程","origin":"C2-61"},{"number":56,"kind":"multi","stem":"哪些做法有助于让提示词的要求更清楚？","options":["指定输出字段与格式","故意省略受众和用途","明确任务和背景","使用分隔符即可省略任务目标和背景"],"answer":["A","C"],"explanation":"2.3 清楚的目标、分隔和格式有助于控制输出；分隔符不能替代任务目标与背景。","category":"大模型提示词工程","origin":"C2-62"},{"number":57,"kind":"multi","stem":"Meta Prompting 的合理流程包括哪些？","options":["只提供初始提示词就能保证改进效果","说明期望的目标和约束","让模型分析差距并提出改进","不验证改进效果就直接认定成功"],"answer":["B","C"],"explanation":"2.3 Meta Prompting 仍需实际验证；还需给出不理想输出并验证改进。","category":"大模型提示词工程","origin":"C2-64"},{"number":58,"kind":"multi","stem":"团队分别用普通模型和专门的推理大模型处理复杂任务。关于提示词设计，哪些做法合理？","options":["应根据实际响应调整提示词","普通复杂任务可尝试用分步思考帮助推理","对推理大模型应保持任务清楚并给足背景","所有推理大模型都必须额外加入长篇思维链指令"],"answer":["A","B","C"],"explanation":"2.3 对推理大模型不宜机械堆砌思维链。","category":"大模型提示词工程","origin":"C2-65"},{"number":59,"kind":"multi","stem":"建立 RAG 索引通常涉及哪些步骤？","options":["存储索引","文档解析","文本分段","文本向量化"],"answer":["A","B","C","D"],"explanation":"2.2 四项都是建索引流程。","category":"大模型检索增强","origin":"C2-57"},{"number":60,"kind":"multi","stem":"对多轮 RAG 的指代问题，哪些处理合理？","options":["用改写后的独立问题检索","改写后的问题无需检查是否保留原意","永远只使用“他的主管是谁”作为查询","利用对话历史改写当前问题"],"answer":["A","D"],"explanation":"2.2 改写、检索与观察改写结果构成有效排查；改写后仍要检查原意是否保留。","category":"大模型检索增强","origin":"C2-59"},{"number":61,"kind":"multi","stem":"关于 `context recall`，哪些判断合理？","options":["偏低时可检查切片和召回策略","它等同于回答的语言风格","它与 `context precision` 衡量完全相同的内容","它关注答案所需信息是否被召回"],"answer":["A","D"],"explanation":"2.4 Recall 不评价语言风格；Recall 与 Precision 关注点不同。","category":"大模型检索增强","origin":"C2-67"},{"number":62,"kind":"multi","stem":"用户问题进入知识库检索前，团队希望减少指代不明和检索词过窄的问题。哪些处理方式可用？","options":["问题改写或扩写","提取结构化标签","遇到歧义问题时无需澄清用户意图","直接把所有候选结果当成最终答案"],"answer":["A","B"],"explanation":"2.5 均为检索前改善问题表达的办法；歧义问题应澄清，而非忽略。","category":"大模型检索增强","origin":"C2-72"},{"number":63,"kind":"multi","stem":"关于重排序与滑动窗口，哪些说法正确？","options":["重排序与滑动窗口都属于检索前的问题改写","两者都保证答案绝不出错","重排序可从较大召回集合中筛出更相关片段","滑动窗口可补充命中片段的相邻语境"],"answer":["C","D"],"explanation":"2.5 两种方法改善参考信息，不能保证零错误；两者用于处理检索结果，不属于问题改写。","category":"大模型检索增强","origin":"C2-74"},{"number":64,"kind":"multi","stem":"数据合成蒸馏流程可包括哪些步骤？","options":["用合成数据训练学生","设计多样化问题","教师标注","质量过滤"],"answer":["A","B","C","D"],"explanation":"4.1 四步构成数据合成蒸馏流程。","category":"大模型微调","origin":"C4-51"},{"number":65,"kind":"multi","stem":"关于三条蒸馏路径，哪些说法正确？","options":["白盒知识蒸馏需要更深入的教师内部信息","推理压缩完全不涉及推理过程，只复制最终答案","三条路径都必须访问商业模型权重","黑盒数据合成只需教师输出"],"answer":["A","D"],"explanation":"4.1 黑盒路径不需教师权重；推理压缩会利用推理轨迹。","category":"大模型微调","origin":"C4-53"},{"number":66,"kind":"multi","stem":"训练曲线中哪些观察提示需要排查？","options":["训练和验证都趋稳且独立评测良好","Loss 剧烈震荡不降","验证 loss 先降后升","训练 loss 下降而验证不改善时无需排查"],"answer":["B","C"],"explanation":"4.1 三种异常都应排查；训练与验证走势分离需要排查。","category":"大模型微调","origin":"C4-55"},{"number":67,"kind":"multi","stem":"小模型部署是否划算，应计入哪些因素？","options":["预期请求规模","教师 API 调用成本","数据合成和训练成本","GPU 部署及运维成本"],"answer":["A","B","C","D"],"explanation":"4.1 完整经济性分析包含各项成本及规模。","category":"大模型微调","origin":"C4-59"},{"number":68,"kind":"multi","stem":"一个可靠的工具调用流程通常包含哪些环节？","options":["将工具结果返回给模型","告知模型可用工具","校验工具名与参数","在程序中执行工具"],"answer":["A","B","C","D"],"explanation":"3.1 四项构成可靠工具调用链。","category":"多 Agent 及多模态应用","origin":"C3-52"},{"number":69,"kind":"multi","stem":"设计工作流时，需要考虑哪些关系？","options":["每个步骤的输入输出","只按步骤名称排序","只要步骤命名清楚，就不用判断子任务能否并行","哪些步骤依赖前序结果"],"answer":["A","D"],"explanation":"3.2 工作流需定义依赖与接口；并行关系仍需判断。","category":"多 Agent 及多模态应用","origin":"C3-57"},{"number":70,"kind":"multi","stem":"分层规划模式通常包括哪些职责？","options":["汇总并检查各部分结果","所有角色完全不沟通","上层拆解与分配任务","专家角色执行子任务"],"answer":["A","C","D"],"explanation":"3.3 分层模式需要分工与整合。","category":"多 Agent 及多模态应用","origin":"C3-61"},{"number":71,"kind":"multi","stem":"团队准备使用能处理图片等非纯文本输入的多模态模型。哪些任务属于合适的应用场景？","options":["纸质表单信息提取","视频理解不属于多模态应用","仅靠文本关键词推断图片细节","从商品图片提取属性"],"answer":["A","D"],"explanation":"5.2 列出图片、表单与视频场景；视频理解属于多模态场景。","category":"多 Agent 及多模态应用","origin":"C5-8"},{"number":72,"kind":"multi","stem":"部署后验证服务应包括哪些检查？","options":["返回内容符合基本预期","延迟和吞吐达到目标","只看进程名存在即可","接口可访问"],"answer":["A","B","D"],"explanation":"4.2 只看进程不足以验证服务。","category":"生产环境应用实践","origin":"C4-61"},{ ns":["服务器时区","文档页数","随机种子","先前对话语境"],"answer":["D"],"explanation":"2.1 多轮理解依赖应用显式传入相关历史。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":16,"kind":"single","stem":"接收流式回复时，前端应如何处理到达的内容？","options":["等全部生成后才逐字模拟显示","把每个片段当成新的用户问题","按到达顺序逐步拼接并展示","只保留最后一个片段"],"answer":["C"],"explanation":"2.1 流式调用返回增量内容，需逐步组合展示。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":17,"kind":"single","stem":"文本先转成 Token ID，再映射为向量，这一步主要使模型得到什么？","options":["公司知识库的全部答案","可计算的数值表示","固定的最终回复","永久保存的会话记录"],"answer":["B"],"explanation":"2.1 向量是供模型计算的表示，不能直接视为答案。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":18,"kind":"single","stem":"模型输出一个 Token 后继续预测下一个，下一步会用到什么？","options":["新的人工标注数据集","另一套数据库模式","已生成的 Token 与原上下文","重新训练后的权重"],"answer":["C"],"explanation":"2.1 自回归生成把已输出内容加入后续预测上下文。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":19,"kind":"single","stem":"需要更多创意表达时，相比事实问答，通常可怎样调整温度？","options":["始终设为最低","适当提高","删除用户问题","关闭分词器"],"answer":["B"],"explanation":"2.1 提高温度通常增加采样多样性，但需实际验证。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":20,"kind":"single","stem":"内部制度答疑把大量无关文档塞入提示词，除了占用窗口，还可能造成什么影响？","options":["保证答案可追溯","消除 Token 费用","自动修复过时制度","干扰模型定位相关依据"],"answer":["D"],"explanation":"2.1 无关内容会增加噪声，影响模型利用关键资料。","category":"C2 · 课时练习","origin":"课时 2.1 新题"},{"number":21,"kind":"multi","stem":"关于多轮对话，哪些说法正确？","options":["模型会自动保留所有历史，且不占用上下文窗口","只传最新问题时模型仍必定知道此前谈到谁","跨会话连续对话通常需要持久化历史","历史中的用户问题和模型回答可一起放入 `messages`"],"answer":["C","D"],"explanation":"2.1 历史需显式传入，长历史占窗口，跨会话需存储；历史必须显式传入，并会占用窗口。","category":"C2 · 课时练习","origin":"章节卷 C2-51"},{"number":22,"kind":"multi","stem":"一个语言模型从用户文本生成回复时，通常会经历哪些处理环节？","options":["分词并得到 Token ID","Token ID 本身就是语义向量，不需要映射","根据概率选择后续 Token","每输出一个 Token 都重新训练权重"],"answer":["A","C"],"explanation":"2.1 生成时不重新训练权重；Token ID 仍需映射为向量。","category":"C2 · 课时练习","origin":"章节卷 C2-52"},{"number":23,"kind":"multi","stem":"答疑应用改为边生成边向用户显示回答。关于这种流式输出，哪些判断正确？","options":["一定会提高最终答案准确率","可逐步把生成内容发给用户","能改善等待完整回复时的感受","本身不能补足缺失的公司知识"],"answer": :"C2 · 课时练习","origin":"章节卷 C2-20"},{"number":9,"kind":"single","stem":"开发者把一批内部文档传给 LlamaIndex 的 `VectorStoreIndex.from_documents()`。这个调用主要完成什么？","options":["只负责在屏幕显示文档","直接训练模型权重","自动审批知识库权限","读取文档并建立可检索索引"],"answer":["D"],"explanation":"2.2 该接口用于根据文档构建索引，包含后续切分与向量化流程。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":10,"kind":"single","stem":"索引已存在，用户提出新问题时，检索生成阶段首先需要处理什么？","options":["再次人工编写所有问答对","重新安装 Python","先删除全部原文","把问题转为可与索引比较的表示"],"answer":["D"],"explanation":"2.2 查询要能与索引中的切片进行相关性比较。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":11,"kind":"single","stem":"如果每次启动答疑服务都重新解析全部资料，优先可采用什么办法？","options":["把温度调到最高","删除历史消息","持久化索引并在启动时加载","只返回空答案"],"answer":["C"],"explanation":"2.2 保存与加载索引可避免重复建索引。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":12,"kind":"single","stem":"源文档已修改，但应用仍加载旧索引，最可能出现什么问题？","options":["模型参数自动更新","所有问题都转成图片","对话角色消失","旧知识仍被检索到"],"answer":["D"],"explanation":"2.2 持久化索引不会自动同步后来修改的源文件。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":13,"kind":"single","stem":"多轮 RAG 中，“他的主管是谁”直接用于检索，为什么可能失效？","options":["代词缺少明确指代对象","多轮对话必须关闭检索","查询文字过短必然无法向量化","主管信息不能存入文档"],"answer":["A"],"explanation":"2.2 问题需借助历史补足指代对象。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":14,"kind":"single","stem":"用户连续追问“它是谁批准的？”，机器人先把追问改写成独立问题再检索。调试改写质量时，应重点查看什么？","options":["改写后的独立问题","随机文件名","操作系统壁纸","模型权重矩阵"],"answer":["A"],"explanation":"2.2 观察改写结果能判断检索是否找对方向。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":15,"kind":"single","stem":"将整段冗长聊天原样向量化检索，相比改写独立问题，可能有什么缺点？","options":["保证向量维度更高","自动补齐所有缺失文档","无关历史干扰检索语义","让索引不再需要保存"],"answer":["C"],"explanation":"2.2 冗长历史可能削弱 embedding 对当前意图的表达。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":16,"kind":"single","stem":"检索到的片段与问题一起提供给模型，其直接目的是什么？","options":["自动扩容数据库","让生成有相关资料可参考","替代所有用户输入","立即改变模型参数"],"answer":["B"],"explanation":"2.2 RAG 在生成时提供与问题相关的外部依据。","category":"C2 · 课时练习","origin":"课时 2.2 新题"},{"number":17,"kind":"multi","stem":"建立 RAG 索引通常涉及哪些步骤？","options":[" ,"answer":["B"],"explanation":"3.1 工具名必须经过校验，不能照单执行。","category":"C3 · 课时练习","origin":"课时 3.1 新题"},{"number":11,"kind":"single","stem":"搜索工具需要查询词，模型只返回“调用搜索”但缺少参数，合理处理是？","options":["忽略参数直接执行","删除所有工具","校验参数并要求补全或重试","直接展示成功消息"],"answer":["C"],"explanation":"3.1 结构化调用还需检查必填参数。","category":"C3 · 课时练习","origin":"课时 3.1 新题"},{"number":12,"kind":"single","stem":"在 ReAct 流程中，搜索返回了空结果，下一步应依据什么决定？","options":["上一次的假设","工具观察结果","固定复制预设答案","跳过任何反馈"],"answer":["B"],"explanation":"3.1 行动后的观察会影响后续决策。","category":"C3 · 课时练习","origin":"课时 3.1 新题"},{"number":13,"kind":"single","stem":"多个应用都要接入相同工具服务，MCP 主要帮助减少什么？","options":["所有网络延迟","模型训练成本","重复的定制集成","文档解析步骤"],"answer":["C"],"explanation":"3.1 统一工具接口便于复用。","category":"C3 · 课时练习","origin":"课时 3.1 新题"},{"number":14,"kind":"multi","stem":"相比硬编码关键词，模型辅助选择工具的价值包括哪些？","options":["处理不同表述的意图","模型辅助选工具后，无需再检查调用规则","仍需验证选择和参数","保证工具永远不会失败"],"answer":["A","C"],"explanation":"3.1 模型理解意图仍需校验；模型选工具仍需校验调用。","category":"C3 · 课时练习","origin":"章节卷 C3-51"},{"number":15,"kind":"multi","stem":"一个可靠的工具调用流程通常包含哪些环节？","options":["将工具结果返回给模型","告知模型可用工具","校验工具名与参数","在程序中执行工具"],"answer":["A","B","C","D"],"explanation":"3.1 四项构成可靠工具调用链。","category":"C3 · 课时练习","origin":"章节卷 C3-52"},{"number":16,"kind":"multi","stem":"关于 Function Calling，哪些说法正确？","options":["模型提出调用后，无需再把工具结果返回模型","模型一提出调用，外部操作就一定已完成","模型可产出结构化调用请求","调用方负责实际执行工具"],"answer":["C","D"],"explanation":"3.1 提出调用不等于执行完成；工具结果仍需交给模型组织答复。","category":"C3 · 课时练习","origin":"章节卷 C3-53"},{"number":17,"kind":"multi","stem":"关于 ReAct，哪些说法正确？","options":["工具结果是模型预先知道的，无需观察","后续行动可依据观察调整","只要采用 ReAct 就无需权限控制","可形成思考、行动、观察循环"],"answer":["B","D"],"explanation":"3.1 ReAct 不免除权限控制；工具结果是执行后的观察。","category":"C3 · 课时练习","origin":"章节卷 C3-54"},{"number":18,"kind":"multi","stem":"MCP 带来的工程收益可能有哪些？","options":["工具能力与具体 Agent 实现解耦","减少每个应用重复集成同一工具","使用 MCP 后就不再需要管理工具权限","保证任何外部数据都可信"],"answer":["A","B"],"explanation":"3.1 MCP 不保证数据真实；MCP 不能免除权限管理。","category":"C3 · 课时练习","origin":"章节卷 C3-55"},{"number":19,"kind":"multi"," 些情况？","options":["质量门槛清晰","需要可重复执行","每次任务都完全未知且依赖随时改变","业务流程稳定"],"answer":["A","B","D"],"explanation":"3.2 稳定可重复任务适合固定流。","category":"C3 · 课时练习","origin":"章节卷 C3-58"},{"number":17,"kind":"multi","stem":"自主规划更可能适用于哪些情况？","options":["任务变化多","所需步骤难以预设","需要根据中间发现继续拆解","永远比固定流程便宜"],"answer":["A","B","C"],"explanation":"3.2 变化多的任务可自主规划。","category":"C3 · 课时练习","origin":"章节卷 C3-59"},{"number":18,"kind":"multi","stem":"允许 Agent 自行创建或修改工具时，应注意哪些问题？","options":["仅凭工具名字就认定安全","权限边界","工具行为验证","允许 Agent 新建工具后，无需设计错误处理或回滚"],"answer":["B","C"],"explanation":"3.2 新工具需校验并受权限约束；新工具仍需错误处理与回滚。","category":"C3 · 课时练习","origin":"章节卷 C3-60"},{"number":19,"kind":"multi","stem":"外部反馈相比模型自评，可能来自哪些可核对的结果？","options":["测试运行结果","代码执行报错","明确标准的人类审查","只说“更认真一点”"],"answer":["A","B","C"],"explanation":"3.2 可观察的执行结果和人工标准能形成反馈。","category":"C3 · 课时练习","origin":"课时 3.2 新题"},{"number":20,"kind":"multi","stem":"选择固定工作流或自主规划时，哪些因素值得比较？","options":["步骤是否稳定","目标是否清晰","每次任务的变化程度","只看界面颜色"],"answer":["A","B","C"],"explanation":"3.2 流程可预设程度影响规划方式。","category":"C3 · 课时练习","origin":"课时 3.2 新题"}],"previousVersions":[{"version":"bd892880a710","revisedQuestions":[]}]},{"id":"C3-3.3","title":"3.3 · 用多Agent实现团队协作","subtitle":"12 题 · 单选 8 / 多选 4","version":"405925a17a58","section":"lesson","chapter":"C3","questions":[{"number":1,"kind":"single","stem":"一项任务需要同时完成资料检索、财务分析和报告撰写，且各步骤职责清楚。哪种多 Agent 协作模式更合适？","options":["只做关键词匹配","主管规划、专家执行的分层模式","不分工的单 Agent","随机选一个工具"],"answer":["B"],"explanation":"3.3 可拆解任务适合分层协作。","category":"C3 · 课时练习","origin":"章节卷 C3-20"},{"number":2,"kind":"single","stem":"开放式创意问题需要多个角色交换观点，更适合哪种模式？","options":["只读文件模式","纯向量检索","共创协作模式","固定的单步流程"],"answer":["C"],"explanation":"3.3 开放问题适合共创。","category":"C3 · 课时练习","origin":"章节卷 C3-21"},{"number":3,"kind":"single","stem":"多 Agent 分工的核心价值是什么？","options":["保证每个角色都使用同一提示词","免去所有验证","保证零成本","让不同角色处理擅长的部分并整合结果"],"answer":["D"],"explanation":"3.3 专业分工并整合结果。","category":"C3 · 课时练习","origin":"章节卷 C3-22"},{"number":4,"kind":"single","stem":"多 Agent 系统通常需要权 AI 助手。","category":"C5 · 课时练习","origin":"课时 5.2 新题"}],"previousVersions":[{"version":"30a2c4f753b8","revisedQuestions":[]}]}]</script>
  <script>
    (function () {
      "use strict";
      var papers = JSON.parse(document.getElementById("quiz-data").textContent);
      var app = document.getElementById("app");
      var activeId = null;
      var showingWrongBook = false;
      var reviewPaper = null;
      var memory = {};
      var timerAnchor = null;
      var timerInterval = null;
      var storageWorks = true;
      try {
        localStorage.setItem("acp-quiz:probe", "1");
        localStorage.removeItem("acp-quiz:probe");
      } catch (error) {
        storageWorks = false;
      }
      var wrongBook = loadWrongBook();
      var letters = ["A", "B", "C", "D"];
      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (char) {
          return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char];
        });
      }
      function paperById(id) { return id === "WRONG" ? reviewPaper : papers.find(function (paper) { return paper.id === id; }); }
      function storageKey(paper) { return "acp-quiz:" + paper.id + ":" + paper.version; }
      function freshState() { return {cursor:0, responses:{}, elapsedMs:0, finished:false}; }
      function loadWrongBook() {
        if (!storageWorks) return {items:[], seen:{}, review:null};
        try {
          var saved = JSON.parse(localStorage.getItem("acp-quiz:wrongbook:v1") || "null");
          if (saved && Array.isArray(saved.items) && saved.seen && typeof saved.seen === "object") {
            return {items:saved.items, seen:saved.seen, review:saved.review || null};
          }
        } catch (error) { /* Invalid saved data starts an empty collection. */ }
        return {items:[], seen:{}, review:null};
      }
      function saveWrongBook() {
        if (!storageWorks) return;
        try { localStorage.setItem("acp-quiz:wrongbook:v1", JSON.stringify(wrongBook)); }
        catch (error) { storageWorks = false; }
      }
      function wrongKey(question) {
        return JSON.stringify([question.kind, question.options, question.answer, question.explanation]);
      }
      function reconcileWrongBook() {
        var currentQuestions = {};
        papers.forEach(function (paper) {
          paper.questions.forEach(function (question) { currentQuestions[wrongKey(question)] = question; });
        });
        var replacements = {};
        var merged = {};
        wrongBook.items.forEach(function (entry) {
          var oldKey = entry.key;
          var key = wrongKey(entry.question);
          replacements[oldKey] = key;
          entry.key = key;
          if (currentQuestions[key]) entry.question.stem = currentQuestions[key].stem;
          if (merged[key]) {
            var kept = merged[key];
            kept.wrongCount += entry.wrongCount || 0;
            kept.reviewCount += entry.reviewCount || 0;
            (entry.sources || []).forEach(function (source) {
              if (kept.sources.indexOf(source) === -1) kept.sources.push(source);
            });
            if ((entry.lastWrongAt || 0) > (kept.lastWrongAt || 0)) {
              kept.lastWrongAt = entry.lastWrongAt;
              kept.lastSelected = entry.lastSelected;
              kept.mastered = entry.mastered;
            }
          } else merged[key] = entry;
        });
        wrongBook.items = Object.keys(merged).map(function (key) { return merged[key]; });
        if (wrongBook.review && Array.isArray(wrongBook.review.keys)) {
          wrongBook.review.keys = wrongBook.review.keys.map(function (key) { return replacements[key] || key; });
        }
        var seen = {};
        Object.keys(wrongBook.seen).forEach(function (marker) {
          var updated = marker;
          Object.keys(replacements).forEach(function (oldKey) {
            if (oldKey !== replacements[oldKey]) updated = updated.replace(':' + oldKey + ':', ':' + replacements[oldKey] + ':');
          });
          seen[updated] = wrongBook.seen[marker];
        });
        wrongBook.seen = seen;
        saveWrongBook();
      }
      function collectWrong(paper, question, selected, historical) {
        var marker = paper.id + ":" + wrongKey(question) + ":" + selected.slice().sort().join("");
        if (historical && wrongBook.seen[marker]) return;
        var key = wrongKey(question);
        var entry = wrongBook.items.find(function (item) { return item.key === key; });
        if (!entry) {
          entry = {key:key, question:{kind:question.kind, stem:question.stem, options:question.options.slice(),
            answer:question.answer.slice(), explanation:question.explanation}, sources:[], wrongCount:0,
            reviewCount:0, mastered:false, lastSelected:[], lastWrongAt:0};
          wrongBook.items.push(entry);
        }
        if (entry.sources.indexOf(paper.title) === -1) entry.sources.push(paper.title);
        entry.wrongCount += 1;
        entry.lastSelected = selected.slice();
        entry.lastWrongAt = Date.now();
        entry.mastered = false;
        wrongBook.seen[marker] = true;
        saveWrongBook();
      }
      function importPastWrongAnswers() {
        papers.forEach(function (paper) {
          var state = getState(paper);
          paper.questions.forEach(function (question, index) {
            var response = responseFor(state, index);
            if (response.submitted && !isCorrect(response.selected, question.answer)) {
              collectWrong(paper, question, response.selected, true);
            }
          });
        });
      }
      function buildReviewPaper(keys) {
        var questions = keys.map(function (key) {
          return wrongBook.items.find(function (item) { return item.key === key; });
        }).filter(Boolean).map(function (entry, index) {
          return {number:index + 1, kind:entry.question.kind, stem:entry.question.stem,
            options:entry.question.options, answer:entry.question.answer,
            explanation:entry.question.explanation, category:entry.sources[0] || "错题集", wrongKey:entry.key};
        });
        return {id:"WRONG", title:"错题重练", subtitle:questions.length + " 道错题", section:"review", questions:questions};
      }
      function startWrongReview(keys) {
        if (!keys.length) return;
        wrongBook.review = {keys:keys.slice(), state:freshState()};
        saveWrongBook();
        reviewPaper = buildReviewPaper(keys);
        memory.WRONG = wrongBook.review.state;
        showingWrongBook = false;
        activeId = "WRONG";
        render();
        startTimer();
        focusCurrentQuestion(reviewPaper);
      }
      function getState(paper) {
        if (paper.id === "WRONG") {
          if (memory.WRONG) return memory.WRONG;
          memory.WRONG = wrongBook.review && wrongBook.review.state ? wrongBook.review.state : freshState();
          return memory.WRONG;
        }
        if (memory[paper.id]) return memory[paper.id];
        var state = freshState();
        if (storageWorks) {
          try {
            var found = JSON.parse(localStorage.getItem(storageKey(paper)) || "null");
            var migration = null;
            var previousVersions = paper.previousVersions || (paper.previousVersion ? [{version:paper.previousVersion, revisedQuestions:paper.revisedQuestions || []}] : []);
            for (var v = 0; !found && v < previousVersions.length; v++) {
              found = JSON.parse(localStorage.getItem("acp-quiz:" + paper.id + ":" + previousVersions[v].version) || "null");
              if (found) migration = previousVersions[v];
            }
            if (found && Number.isInteger(found.cursor) && found.cursor >= 0 && found.cursor <= paper.questions.length && found.responses && typeof found.responses === "object") state = found;
            if (migration && state === found) {
              var firstChanged = paper.questions.length;
              (migration.revisedQuestions || []).forEach(function (index) {
                if (Object.prototype.hasOwnProperty.call(state.responses, String(index))) {
                  delete state.responses[String(index)];
                  firstChanged = Math.min(firstChanged, index);
                }
              });
              if (firstChanged < paper.questions.length) {
                state.cursor = Math.min(state.cursor, firstChanged);
                state.finished = false;
                delete state.latestResult;
              }
              localStorage.setItem(storageKey(paper), JSON.stringify(state));
            }
          } catch (error) { state = freshState(); }
        }
        if (!Number.isFinite(state.elapsedMs) || state.elapsedMs < 0) state.elapsedMs = 0;
        if (state.cursor >= paper.questions.length) state.finished = true;
        if (!state.latestResult && completedCount(state) === paper.questions.length) {
          state.latestResult = makeResult(paper, state);
          if (storageWorks) {
            try { localStorage.setItem(storageKey(paper), JSON.stringify(state)); }
            catch (error) { storageWorks = false; }
          }
        }
        memory[paper.id] = state;
        return state;
      }
      function saveState(paper) {
        if (paper.id === "WRONG") {
          if (wrongBook.review) wrongBook.review.state = getState(paper);
          saveWrongBook();
          return;
        }
        if (!storageWorks) return;
        try { localStorage.setItem(storageKey(paper), JSON.stringify(getState(paper))); }
        catch (error) {
          storageWorks = false;
          render();
        }
      }
      function responseFor(state, index) {
        var answer = state.responses[String(index)];
        return answer && Array.isArray(answer.selected) ? answer : {selected:[], submitted:false};
      }
      function isCorrect(selected, answer) {
        return selected.slice().sort().join("") === answer.slice().sort().join("");
      }
      function completedCount(state) {
        return Object.values(state.responses).filter(function (r) { return r && r.submitted; }).length;
      }
      function correctCount(paper, state) {
        return paper.questions.reduce(function (total, question, index) {
          var response = responseFor(state, index);
          return total + (response.submitted && isCorrect(response.selected, question.answer) ? 1 : 0);
        }, 0);
      }
      function weightedScore(paper, state) {
        return paper.questions.reduce(function (total, question, index) {
          var response = responseFor(state, index);
          return total + (response.submitted && isCorrect(response.selected, question.answer) ? (question.kind === "multi" ? 2 : 1) : 0);
        }, 0);
      }
      function isFullPaper(paper) {
        return paper.id !== "WRONG" && paper.questions.length === 75 &&
          paper.questions.filter(function (q) { return q.kind === "single"; }).length === 50 &&
          paper.questions.filter(function (q) { return q.kind === "multi"; }).length === 25;
      }
      function makeResult(paper, state) {
        var correct = correctCount(paper, state);
        return {correct:correct, total:paper.questions.length, score:isFullPaper(paper) ? weightedScore(paper, state) : null,
          percent:Math.round(correct / paper.questions.length * 100), completedAt:Date.now()};
      }
      function formatElapsed(ms) {
        var seconds = Math.floor(ms / 1000);
        var hours = Math.floor(seconds / 3600);
        var minutes = Math.floor(seconds % 3600 / 60);
        var rest = seconds % 60;
        return [hours, minutes, rest].map(function (part) { return String(part).padStart(2, "0"); }).join(":");
      }
      function syncElapsed() {
        if (timerAnchor === null || !activeId) return;
        var now = Date.now();
        var paper = paperById(activeId);
        var state = getState(paper);
        state.elapsedMs += Math.max(0, now - timerAnchor);
        timerAnchor = now;
        saveState(paper);
        var value = document.getElementById("timer-value");
        if (value) value.textContent = formatElapsed(state.elapsedMs);
      }
      function stopTimer() {
        syncElapsed();
        timerAnchor = null;
        if (timerInterval !== null) { clearInterval(timerInterval); timerInterval = null; }
      }
      function startTimer() {
        if (!activeId || document.visibilityState === "hidden") return;
        var paper = paperById(activeId);
        if (!paper || getState(paper).finished || getState(paper).cursor >= paper.questions.length || timerAnchor !== null) return;
        timerAnchor = Date.now();
        timerInterval = setInterval(syncElapsed, 1000);
      }
      function noticeMarkup() {
        return storageWorks ? "" : '<div class="notice" role="status">当前浏览器未允许保存本地数据。你仍可答题，但刷新后无法恢复进度、用时和错题集。</div>';
      }
      function renderHome() {
        activeId = null;
        showingWrongBook = false;
        function card(paper, index, isLesson) {
          var state = getState(paper);
          var count = completedCount(state);
          var pct = Math.round(count / paper.questions.length * 100);
          var label = count === paper.questions.length ? "查看成绩" : count ? "继续练习" : "开始练习";
          var latest = state.latestResult;
          var resultMarkup = latest ? (isFullPaper(paper)
            ? '<span class="paper-result ' + (latest.score >= 80 ? 'passed' : 'failed') + '">最近得分 ' + latest.score + ' / 100 · ' + (latest.score >= 80 ? '通过' : '未通过') + '</span>'
            : '<span class="paper-result neutral">最近正确率 ' + latest.percent + '% · 答对 ' + latest.correct + ' / ' + latest.total + ' 题</span>') : '';
          return '<button class="paper-card' + (paper.id === "ALL" ? ' featured' : '') + (isLesson ? ' lesson-card' : '') + '" type="button" data-action="open" data-id="' + esc(paper.id) + '">' +
            '<span class="paper-top"><span class="paper-index">' + (isLesson ? '课时 ' + esc(paper.id.split('-')[1]) : '试卷 0' + (index + 1)) + '</span><span class="paper-arrow" aria-hidden="true">↗</span></span>' +
            '<span class="paper-name">' + esc(paper.title) + '</span><span class="paper-sub">' + esc(paper.subtitle) + '</span>' +
            resultMarkup +
            '<span class="paper-bottom"><span>已完成 ' + count + ' / ' + paper.questions.length + '</span><span>' + label + '</span></span>' +
            '<span class="mini-track" aria-hidden="true"><span class="mini-fill" style="display:block;width:' + pct + '%"></span></span></button>';
        }
        var chapterPapers = papers.filter(function (paper) { return paper.section !== "lesson"; });
        var lessonPapers = papers.filter(function (paper) { return paper.section === "lesson"; });
        var chapterCards = chapterPapers.map(function (paper, index) { return card(paper, index, false); }).join("");
        var chapters = Array.from(new Set(lessonPapers.map(function (paper) { return paper.chapter; })));
        var lessonSections = chapters.map(function (chapter) {
          var items = lessonPapers.filter(function (paper) { return paper.chapter === chapter; });
          var chapterPaper = chapterPapers.find(function (paper) { return paper.id === chapter; });
          var chapterTitle = chapterPaper ? chapterPaper.title : chapter;
          return '<div class="lesson-group"><h3 class="lesson-group-title">' + esc(chapterTitle) + '<span>' + items.length + ' 节课</span></h3><div class="paper-grid lesson-grid">' +
            items.map(function (paper, index) { return card(paper, index, true); }).join("") + '</div></div>';
        }).join("");
        var pendingWrong = wrongBook.items.filter(function (entry) { return !entry.mastered; }).length;
        var wrongEntry = '<button class="wrongbook-entry" type="button" data-action="wrongbook"><span><strong>错题集</strong><span>自动收集答错的题，随时查看和重练</span></span>' +
          '<span>已收录 ' + wrongBook.items.length + ' 道 · 待巩固 ' + pendingWrong + ' 道</span><span class="paper-arrow" aria-hidden="true">↗</span></button>';
        app.innerHTML = '<section class="home-section"><span class="eyebrow">大模型 ACP · 自主练习</span><h1 id="page-title" tabindex="-1">选一套题，接着练</h1>' +
          '<p class="intro">可按章节练习，也可按课时巩固。多选题的正确选项数量不固定；每套题的进度和累计用时分别保存在这个浏览器里。题库更新后，改过的题需重答，其他记录会保留。</p>' +
          noticeMarkup() + wrongEntry + '<h2>章节卷与综合卷</h2><div class="paper-grid">' + chapterCards + '</div></section>' +
          '<section class="home-section"><span class="eyebrow">学完一节，练一节</span><h2>按课时练习</h2>' + lessonSections + '</section>';
      }
      function renderWrongBook() {
        activeId = null;
        showingWrongBook = true;
        var pending = wrongBook.items.filter(function (entry) { return !entry.mastered; });
        var reviewing = wrongBook.review && wrongBook.review.state && !wrongBook.review.state.finished &&
          wrongBook.review.state.cursor < wrongBook.review.keys.length;
        var actions = wrongBook.items.length ? '<div class="wrongbook-actions">' +
          (pending.length ? '<button class="primary-btn" type="button" data-action="review-pending">重练待巩固 · ' + pending.length + ' 道</button>' : '') +
          '<button class="secondary-btn" type="button" data-action="review-all">重练全部 · ' + wrongBook.items.length + ' 道</button>' +
          (reviewing ? '<button class="secondary-btn" type="button" data-action="resume-review">继续上次重练</button>' : '') + '</div>' : '';
        var ordered = wrongBook.items.map(function (entry, index) { return {entry:entry, index:index}; })
          .sort(function (a, b) { return Number(a.entry.mastered) - Number(b.entry.mastered) || b.entry.lastWrongAt - a.entry.lastWrongAt; });
        var entries = ordered.map(function (item) {
          var entry = item.entry;
          var choices = entry.question.options.map(function (option, index) {
            var letter = letters[index];
            var right = entry.question.answer.indexOf(letter) !== -1;
            var selected = entry.lastSelected.indexOf(letter) !== -1;
            var mark = selected && right ? '上次选中 · 正确选项' : right ? '正确选项' : selected ? '上次误选' : '';
            return '<li class="wrong-option' + (right ? ' correct' : selected ? ' wrong' : '') + '"><span class="wrong-option-letter">' + letter + '.</span><span class="wrong-option-text">' + esc(option) + '</span>' +
              (mark ? '<span class="wrong-option-mark">' + mark + '</span>' : '') + '</li>';
          }).join('');
          return '<details class="wrong-item"><summary><span class="wrongbook-status' + (entry.mastered ? ' mastered' : '') + '">' + (entry.mastered ? '已掌握' : '待巩固') + '</span> · ' + esc(entry.question.stem) + '</summary>' +
            '<div class="wrong-body"><p class="wrongbook-meta">' + (entry.question.kind === 'multi' ? '多选题' : '单选题') + ' · 答错 ' + entry.wrongCount + ' 次 · 来源：' + esc(entry.sources.join('、')) + '</p>' +
            '<ol class="wrong-options">' + choices + '</ol><p>上次选择：' + esc(entry.lastSelected.join('、')) + '　正确答案：' + esc(entry.question.answer.join('、')) + '</p>' +
            '<p class="wrong-explanation">解析：' + esc(entry.question.explanation) + '</p><button class="secondary-btn" type="button" data-action="retry-one" data-id="' + item.index + '">重做这题</button></div></details>';
        }).join('');
        app.innerHTML = '<div class="quiz-wrap"><button class="back-link" type="button" data-action="home">← 返回试卷列表</button>' + noticeMarkup() +
          '<section class="wrongbook-head"><div><span class="eyebrow">持续积累 · 随时重练</span><h1 id="wrongbook-title" tabindex="-1">错题集</h1><p class="summary-sub">已收录 ' + wrongBook.items.length + ' 道 · 待巩固 ' + pending.length + ' 道。答对重练题后会标记为已掌握，题目仍留在这里。</p></div>' + actions + '</section>' +
          (entries || '<div class="wrongbook-empty"><p>还没有错题。做题时答错的题会自动出现在这里。</p></div>') + '</div>';
      }
      function renderQuiz(paper) {
        var state = getState(paper);
        if (state.cursor >= paper.questions.length) { renderSummary(paper); return; }
        var index = state.cursor;
        var question = paper.questions[index];
        var isMulti = question.kind === "multi";
        var startsMulti = isMulti && (index === 0 || paper.questions[index - 1].kind !== "multi");
        var response = responseFor(state, index);
        var submitted = !!response.submitted;
        var correct = submitted && isCorrect(response.selected, question.answer);
        var done = completedCount(state);
        var pct = Math.round(done / paper.questions.length * 100);
        var options = question.options.map(function (text, optionIndex) {
          var letter = letters[optionIndex];
          var chosen = response.selected.indexOf(letter) !== -1;
          var right = question.answer.indexOf(letter) !== -1;
          var style = submitted ? (right ? " correct" : chosen ? " wrong" : "") : chosen ? " selected" : "";
          var mark = submitted && right ? '<span class="choice-mark">正确答案</span>' : submitted && chosen ? '<span class="choice-mark">你的选择</span>' : "";
          return '<label class="choice' + style + '"><input type="' + (question.kind === "single" ? "radio" : "checkbox") + '" name="choice" value="' + letter + '"' +
            (chosen ? " checked" : "") + (submitted ? " disabled" : "") + '><span class="choice-letter">' + letter + '</span><span class="choice-text">' + esc(text) + '</span>' + mark + '</label>';
        }).join("");
        var feedback = submitted ?
          '<section class="feedback ' + (correct ? "good" : "bad") + '" aria-live="polite"><h3 id="feedback-title" tabindex="-1">' + (correct ? "回答正确" : "回答错误") + '</h3>' +
          '<p>你的选择：' + esc(response.selected.join("、")) + '　正确答案：' + esc(question.answer.join("、")) + '</p>' +
          '<p class="explanation">' + esc(question.explanation) + '</p>' +
          (correct ? (paper.id === 'WRONG' ? '<p>已标记为已掌握，题目仍保留在错题集。</p>' : '') :
            '<p>' + (paper.id === 'WRONG' ? '这题仍标记为待巩固。' : '已自动收录到错题集。') + '</p>') + '</section>' : "";
        var hint = submitted ? "" :
          '<p class="hint">' + (question.kind === "multi" ? "多选题：选出所有正确选项，完全选对才得分。" : "单选题：选择一个答案后提交。") + '</p>';
        var action = submitted ?
          '<button class="primary-btn" type="button" data-action="next">' + (index === paper.questions.length - 1 ? "查看成绩" : "下一题") + '</button>' :
          '<button class="primary-btn" type="button" data-action="submit"' + (response.selected.length ? "" : " disabled") + '>' + (isMulti ? '提交多选答案' : '提交答案') + '</button>';
        var previous = '<button class="secondary-btn" type="button" data-action="previous"' + (index === 0 ? " disabled" : "") + '>上一题</button>';
        var typeAlert = isMulti ? '<div class="type-alert" id="type-alert" tabindex="-1" role="note"><strong>' + (startsMulti ? '题型切换：现在进入多选题' : '注意：本题是多选题') + '</strong><span>可以选择多个选项；必须全部选对才得分。</span></div>' : '';
        app.innerHTML = '<div class="quiz-wrap is-answering"><button class="back-link" type="button" data-action="' + (paper.id === 'WRONG' ? 'wrongbook' : 'home') + '">← 返回' + (paper.id === 'WRONG' ? '错题集' : '试卷列表') + '</button>' +
          noticeMarkup() + '<section class="quiz-top"><div class="quiz-top-line"><p class="quiz-paper-name">' + esc(paper.title) + '</p><div class="quiz-top-stats"><span class="timer-chip">用时 <time id="timer-value">' + formatElapsed(state.elapsedMs) + '</time></span><span class="score-chip">答对 ' + correctCount(paper, state) + ' 题</span></div></div>' +
          '<div class="progress-labels"><span>第 ' + (index + 1) + ' 题 / 共 ' + paper.questions.length + ' 题</span><span>已完成 ' + done + ' / ' + paper.questions.length + '</span></div>' +
          '<div class="progress-track" role="progressbar" aria-label="已完成题目进度" aria-valuemin="0" aria-valuemax="' + paper.questions.length + '" aria-valuenow="' + done + '"><div class="progress-fill" style="width:' + pct + '%"></div></div></section>' +
          '<div class="question-layout"><article class="question-card' + (isMulti ? ' is-multi' : '') + '"><div class="question-meta"><span class="pill' + (isMulti ? ' multi' : '') + '">' + (isMulti ? "多选题" : "单选题") + '</span>' +
          (question.category ? '<span class="pill soft">' + esc(question.category) + '</span>' : "") + '</div>' +
          typeAlert + '<h1 class="question-title" id="question-title" tabindex="-1">' + esc(question.stem) + '</h1><fieldset class="choice-list" aria-label="选择答案">' + options + '</fieldset>' + feedback + hint + '</article><div class="action-dock' + (isMulti ? ' is-multi' : '') + '">' +
          (isMulti ? '<p class="action-type">当前题型：多选</p>' : '') + action + previous + '</div></div></div>';
      }
      function renderSummary(paper) {
        var state = getState(paper);
        var correct = correctCount(paper, state);
        var total = paper.questions.length;
        var fullPaper = isFullPaper(paper);
        var score = fullPaper ? weightedScore(paper, state) : null;
        var wrong = paper.questions.map(function (q, index) {
          var response = responseFor(state, index);
          return response.submitted && !isCorrect(response.selected, q.answer) ? {q:q, response:response} : null;
        }).filter(Boolean);
        var wrongMarkup = wrong.length ? wrong.map(function (item) {
          var choices = item.q.options.map(function (option, index) {
            var letter = letters[index];
            var selected = item.response.selected.indexOf(letter) !== -1;
            var right = item.q.answer.indexOf(letter) !== -1;
            var style = right ? ' correct' : selected ? ' wrong' : '';
            var mark = selected && right ? '你的选择 · 正确选项' : right ? '正确选项' : selected ? '你的选择' : '';
            return '<li class="wrong-option' + style + '"><span class="wrong-option-letter">' + letter + '.</span><span class="wrong-option-text">' + esc(option) + '</span>' +
              (mark ? '<span class="wrong-option-mark">' + mark + '</span>' : '') + '</li>';
          }).join('');
          return '<details class="wrong-item" open><summary>第 ' + item.q.number + ' 题 · ' + (item.q.kind === 'single' ? '单选题' : '多选题') + '</summary><div class="wrong-body">' +
            '<p class="wrong-stem">' + esc(item.q.stem) + '</p><ol class="wrong-options">' + choices + '</ol>' +
            '<p>你的选择：' + esc(item.response.selected.join('、')) + '　正确答案：' + esc(item.q.answer.join('、')) + '</p>' +
            '<p class="wrong-explanation">解析：' + esc(item.q.explanation) + '</p></div></details>';
        }).join("") : '<p>这套卷子全部答对了。</p>';
        app.innerHTML = '<div class="quiz-wrap"><button class="back-link" type="button" data-action="' + (paper.id === 'WRONG' ? 'wrongbook' : 'home') + '">← 返回' + (paper.id === 'WRONG' ? '错题集' : '试卷列表') + '</button>' +
          noticeMarkup() + '<section class="summary-head"><span class="eyebrow">练习完成</span><h1 id="summary-title" tabindex="-1">' + esc(paper.title) + '</h1>' +
          '<div class="summary-number">' + (fullPaper ? score + ' / 100' : correct + ' / ' + total) + '</div>' +
          '<p class="summary-sub">' + (fullPaper ? '模拟得分 · 答对 ' + correct + ' / ' + total + ' 题 · ' + (score >= 80 ? '达到' : '未达到') + ' 80 分练习参考线' : '正确率 ' + Math.round(correct / total * 100) + '%') + ' · 错题 ' + wrong.length + ' 道 · 用时 ' + formatElapsed(state.elapsedMs) + '</p>' +
          (fullPaper ? '<p class="summary-sub">按单选每题 1 分、多选每题 2 分计算；仅供练习，不代表认证考试成绩。</p>' : '') +
          '<div class="summary-actions"><button class="secondary-btn" type="button" data-action="previous">回看最后一题</button><button class="primary-btn" type="button" data-action="restart">重新练习</button><button class="secondary-btn" type="button" data-action="' + (paper.id === 'WRONG' ? 'wrongbook' : 'home') + '">' + (paper.id === 'WRONG' ? '返回错题集' : '选择其他试卷') + '</button></div></section>' +
          '<section class="wrong-section"><h2>错题回顾</h2>' + wrongMarkup + '</section></div>';
      }
      function render() {
        if (!activeId) { if (showingWrongBook) renderWrongBook(); else renderHome(); }
        else {
          var paper = paperById(activeId);
          if (paper) renderQuiz(paper); else renderHome();
        }
      }
      function focusAfterRender(id) {
        requestAnimationFrame(function () {
          var node = document.getElementById(id);
          if (node) node.focus();
        });
      }
      function focusCurrentQuestion(paper) {
        var index = getState(paper).cursor;
        focusAfterRender(index >= paper.questions.length ? "summary-title" : paper.questions[index].kind === "multi" ? "type-alert" : "question-title");
      }
      app.addEventListener("change", function (event) {
        if (!activeId || event.target.name !== "choice") return;
        var paper = paperById(activeId);
        var state = getState(paper);
        var selected = Array.from(app.querySelectorAll('input[name="choice"]:checked')).map(function (input) { return input.value; });
        state.responses[String(state.cursor)] = {selected:selected, submitted:false};
        saveState(paper);
        app.querySelectorAll(".choice").forEach(function (label) {
          label.classList.toggle("selected", label.querySelector("input").checked);
        });
        var submit = app.querySelector('[data-action="submit"]');
        if (submit) submit.disabled = selected.length === 0;
      });
      app.addEventListener("click", function (event) {
        var control = event.target.closest("[data-action]");
        if (!control) return;
        var action = control.getAttribute("data-action");
        if (action === "home") { stopTimer(); renderHome(); focusAfterRender("page-title"); return; }
        if (action === "wrongbook") { stopTimer(); renderWrongBook(); focusAfterRender("wrongbook-title"); return; }
        if (action === "review-pending" || action === "review-all" || action === "retry-one") {
          stopTimer();
          var keys = action === "retry-one" ? [wrongBook.items[Number(control.getAttribute("data-id"))]?.key].filter(Boolean) :
            wrongBook.items.filter(function (entry) { return action === "review-all" || !entry.mastered; }).map(function (entry) { return entry.key; });
          startWrongReview(keys);
          return;
        }
        if (action === "resume-review") {
          var savedReview = wrongBook.review;
          if (!savedReview || !Array.isArray(savedReview.keys) || !savedReview.keys.length) return;
          reviewPaper = buildReviewPaper(savedReview.keys);
          if (reviewPaper.questions.length !== savedReview.keys.length) return;
          memory.WRONG = savedReview.state;
          showingWrongBook = false;
          activeId = "WRONG";
          render();
          startTimer();
          focusCurrentQuestion(reviewPaper);
          return;
        }
        if (action === "open") {
          activeId = control.getAttribute("data-id");
          showingWrongBook = false;
          render();
          startTimer();
          focusCurrentQuestion(paperById(activeId));
          return;
        }
        var paper = paperById(activeId);
        if (!paper) return;
        var state = getState(paper);
        if (action === "previous") {
          if (state.cursor === 0) return;
          state.cursor -= 1;
          saveState(paper);
          renderQuiz(paper);
          focusCurrentQuestion(paper);
        } else if (action === "submit") {
          var response = responseFor(state, state.cursor);
          if (!response.selected.length || response.submitted) return;
          state.responses[String(state.cursor)] = {selected:response.selected, submitted:true};
          if (paper.id !== "WRONG" && completedCount(state) === paper.questions.length) state.latestResult = makeResult(paper, state);
          saveState(paper);
          var question = paper.questions[state.cursor];
          if (paper.id === "WRONG") {
            var entry = wrongBook.items.find(function (item) { return item.key === question.wrongKey; });
            if (entry) {
              entry.reviewCount = (entry.reviewCount || 0) + 1;
              entry.mastered = isCorrect(response.selected, question.answer);
              if (!entry.mastered) {
                entry.wrongCount += 1;
                entry.lastSelected = response.selected.slice();
                entry.lastWrongAt = Date.now();
              }
              saveWrongBook();
            }
          } else if (!isCorrect(response.selected, question.answer)) {
            collectWrong(paper, question, response.selected, false);
          }
          renderQuiz(paper);
          focusAfterRender("feedback-title");
        } else if (action === "next") {
          if (!responseFor(state, state.cursor).submitted) return;
          if (state.cursor === paper.questions.length - 1) { stopTimer(); state.finished = true; }
          state.cursor += 1;
          saveState(paper);
          renderQuiz(paper);
          focusCurrentQuestion(paper);
        } else if (action === "restart") {
          stopTimer();
          var latestResult = state.latestResult;
          memory[paper.id] = freshState();
          if (latestResult && paper.id !== "WRONG") memory[paper.id].latestResult = latestResult;
          if (paper.id === "WRONG" && wrongBook.review) wrongBook.review.state = memory.WRONG;
          saveState(paper);
          renderQuiz(paper);
          startTimer();
          focusCurrentQuestion(paper);
        }
      });
      document.getElementById("brand-home").addEventListener("click", function () {
        stopTimer();
        renderHome();
        focusAfterRender("page-title");
      });
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") stopTimer();
        else startTimer();
      });
      reconcileWrongBook();
      importPastWrongAnswers();
      render();
    }());
  </script>
</body>
</html>
